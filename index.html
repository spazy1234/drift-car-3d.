<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Drift Car 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111c;color:white;font-family:system-ui;overflow:hidden}#game{width:100vw;height:100dvh;display:block;touch-action:none;background:linear-gradient(#64b9e8,#d8eef0 48%,#28613b 49%,#15351e)}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.box{background:#07111cbb;border:1px solid #ffffff44;border-radius:13px;padding:8px 12px}.small{font-size:10px;letter-spacing:1px;color:#c5e0ed}.num{font-size:22px;font-weight:900}.brand{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:1000;font-style:italic;text-shadow:0 2px 8px #123;white-space:nowrap}.blue{color:#83f3ff}.controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.pad{display:flex;gap:10px;pointer-events:auto}.ctrl{width:66px;height:66px;border:1px solid #ffffff55;border-radius:17px;background:#07111ccc;color:white;font-size:25px;font-weight:bold;touch-action:none}.ctrl:active{background:#168eaa}#drift{font-size:12px;color:#8cf4ff}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#06111b88;padding:18px}.card{width:min(390px,94vw);text-align:center;background:linear-gradient(145deg,#18354b,#07131f);border:1px solid #ffffff44;border-radius:23px;padding:26px 22px;box-shadow:0 20px 70px #0009}.card h1{font-size:34px;font-style:italic;margin:0}.card p{color:#c4d8e5;line-height:1.5}.primary{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(90deg,#12a8c8,#62e6ef);font-size:17px;font-weight:900;color:#04121a}.hint{font-size:12px;color:#91b2c3!important}
</style></head><body><canvas id="game"></canvas><div class="brand">DRIFT CAR <span class="blue">3D</span></div>
<div class="hud"><div class="box"><div class="small">SPEED</div><div class="num blue" id="speed">0 km/h</div></div><div class="box" style="text-align:right"><div class="small">DISTANCE</div><div class="num" id="score">0 m</div></div></div>
<div class="controls"><div class="pad"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="pad"><button class="ctrl" id="drift">DRIFT</button></div></div>
<div class="overlay" id="start"><div class="card"><h1>DRIFT CAR <span class="blue">3D</span></h1><p>Dodge traffic, build speed and drift your way down the highway!</p><button class="primary" id="play">START ENGINE</button><p class="hint">PC: ← → or A / D to steer · Space to drift<br>Phone: use the on-screen controls</p></div></div>
<div class="overlay" id="over" style="display:none"><div class="card"><h1>CRASHED!</h1><p id="result"></p><button class="primary" id="again">RACE AGAIN</button></div></div>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,D=1,run=false,last=0,pos=0,px=0,spd=0,dist=0,cars=[],spawn=0,drift=false;const k={l:false,r:false};
function size(){D=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}new ResizeObserver(size).observe(c);size();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function road(y){let t=clamp((y-H*.22)/(H*.78),0,1);return {t,half:W*(.05+.42*Math.pow(t,1.1)),mid:W/2+Math.sin(pos*.0007+t*2.4)*W*.07*Math.pow(t,1.4)}}
function poly(p,col){x.fillStyle=col;x.beginPath();p.forEach((v,i)=>i?x.lineTo(...v):x.moveTo(...v));x.closePath();x.fill()}
function car(a,b,w,h,col){x.save();x.translate(a,b);x.fillStyle='#0006';x.beginPath();x.ellipse(0,h*.38,w*.65,h*.18,0,0,7);x.fill();x.fillStyle='#111820';x.fillRect(-w*.5,-h*.15,w*.17,h*.5);x.fillRect(w*.33,-h*.15,w*.17,h*.5);x.fillStyle=col;x.beginPath();x.moveTo(-w*.43,h*.38);x.lineTo(-w*.47,-h*.18);x.quadraticCurveTo(-w*.4,-h*.48,-w*.18,-h*.48);x.lineTo(w*.18,-h*.48);x.quadraticCurveTo(w*.4,-h*.48,w*.47,-h*.18);x.lineTo(w*.43,h*.38);x.quadraticCurveTo(0,h*.48,-w*.43,h*.38);x.fill();x.fillStyle='#bceafa';poly([[-w*.28,-h*.13],[-w*.18,-h*.37],[w*.18,-h*.37],[w*.28,-h*.13]],'#bceafa');x.fillStyle='#fff0c7';x.fillRect(-w*.36,h*.22,w*.15,h*.08);x.fillRect(w*.21,h*.22,w*.15,h*.08);x.restore()}
function draw(){x.clearRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,'#5bb7e8');sky.addColorStop(1,'#d4edf0');x.fillStyle=sky;x.fillRect(0,0,W,H*.55);poly([[0,H*.43],[W*.2,H*.33],[W*.4,H*.43],[W*.65,H*.3],[W,H*.42],[W,H],[0,H]],'#397747');let L=[],R=[];for(let i=0;i<=30;i++){let y=H*.22+i/30*H*.78,a=road(y);L.push([a.mid-a.half,y]);R.push([a.mid+a.half,y])}poly([...L,...R.reverse()],'#343a42');
for(let i=0;i<30;i++){let y=H*.22+i/30*H*.78,a=road(y),b=road(y+H*.78/30);if(Math.floor((i+pos*.015)%8)<4){poly([[a.mid-a.half,y],[a.mid-a.half+7,y],[b.mid-b.half+9,y+H*.78/30],[b.mid-b.half,y+H*.78/30]],'#eee9d8');poly([[a.mid+a.half-7,y],[a.mid+a.half,y],[b.mid+b.half,y+H*.78/30],[b.mid+b.half-9,y+H*.78/30]],'#eee9d8')}}
for(let i=0;i<18;i++){let t=(i/18+pos*.0008)%1,y=H*.22+t*H*.78,a=road(y);if(i%2===0)for(let n=1;n<=2;n++){let xx=a.mid-a.half+2*a.half*n/3,d=1+3*t;poly([[xx-d,y],[xx+d,y],[xx+d,y+5+25*t],[xx-d,y+5+25*t]],'#eee9d8')}}
cars.sort((a,b)=>a.z-b.z).forEach(v=>{let y=H*.22+v.z*H*.78,a=road(y);car(a.mid+v.lane*a.half*.62,y,12+36*v.z,22+62*v.z,v.col)});let a=road(H*.87);car(a.mid+px*a.half*.75,H*.86,W*.105,H*.17,'#08a9cf');if(drift){x.globalAlpha=.5;x.fillStyle='#dffaff';for(let n of [-1,1]){x.beginPath();x.ellipse(a.mid+px*a.half*.75+n*W*.045,H*.94,7,20,0,0,7);x.fill()}x.globalAlpha=1}}
function start(){cars=[];px=0;spd=55;dist=0;pos=0;spawn=18;run=true;last=0;$('start').style.display='none';$('over').style.display='none'}
function tick(t){if(!last)last=t;let dt=Math.min((t-last)/16.67,2);last=t;if(run){spd=clamp(spd+.22*dt,0,220);let steer=(k.r?1:0)-(k.l?1:0);px=clamp(px+steer*.035*dt,-.95,.95);if(drift&&steer)dist+=.18*dt;pos+=spd*dt;dist+=spd*.025*dt;spawn-=dt;if(spawn<=0){cars.push({z:0,lane:[-.66,0,.66][Math.floor(Math.random()*3)],col:['#e64e4e','#f1b52e','#8b72df','#e9ecef'][Math.floor(Math.random()*4)]});spawn=48+Math.random()*35-spd*.08}cars.forEach(v=>v.z+=(.004+spd*.000045)*dt);cars=cars.filter(v=>v.z<1.12);for(let v of cars)if(v.z>.78&&v.z<.96&&Math.abs(v.lane-px)<.28){run=false;$('result').textContent='You drove '+Math.floor(dist)+' metres!';$('over').style.display='flex';break}$('speed').textContent=Math.round(spd)+' km/h';$('score').textContent=Math.floor(dist)+' m'}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
$('play').onclick=start;$('again').onclick=start;
function hold(id,key){let b=$(id);b.onpointerdown=e=>{e.preventDefault();k[key]=true};['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>k[key]=false))}hold('left','l');hold('right','r');$('drift').onpointerdown=e=>{e.preventDefault();drift=true};['pointerup','pointerleave','pointercancel'].forEach(v=>$('drift').addEventListener(v,()=>drift=false));
onkeydown=e=>{if(['ArrowLeft','a','A'].includes(e.key)){k.l=true;e.preventDefault()}if(['ArrowRight','d','D'].includes(e.key)){k.r=true;e.preventDefault()}if(e.code==='Space')drift=true};onkeyup=e=>{if(['ArrowLeft','a','A'].includes(e.key))k.l=false;if(['ArrowRight','d','D'].includes(e.key))k.r=false;if(e.code==='Space')drift=false};
})();
</script></body></html>
